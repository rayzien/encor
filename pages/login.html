<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encor - Sign In</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Page Transition -->
    <div class="page-transition" id="page-transition"></div>

    <!-- Navigation -->
    <nav id="navbar">
        <div class="nav-logo font-outfit">
            <i class="fa-solid fa-mountain-sun"></i>
            <span>ENCOR</span>
        </div>
        <ul class="nav-links font-sora">
            <li><a href="/" class="page-link">Home</a></li>
            <li><a href="/login" class="nav-active">Login</a></li>
        </ul>
        <div class="burger-menu" id="burger">
            <div class="burger-line line1"></div>
            <div class="burger-line line2"></div>
            <div class="burger-line line3"></div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobile-menu">
        <ul>
            <li><a href="/" class="mobile-link page-link">Home</a></li>
            <li><a href="/login" class="mobile-link">Login</a></li>
        </ul>
    </div>

    <!-- Login Page -->
    <div class="login-page">
        <!-- Background Effects -->
        <div class="login-bg"></div>
        <div class="login-glow login-glow-1"></div>
        <div class="login-glow login-glow-2"></div>

        <!-- Login Card -->
        <div class="login-card" id="login-card">
            <h1 class="font-outfit">ENCOR</h1>
            <p class="login-subtitle font-crimson">Sign in to your dashboard</p>
            
            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <label for="username" class="font-sora">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="input-group">
                    <label for="password" class="font-sora">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary font-sora" style="width: 100%;">Sign In</button>
                </div>
                
                <p id="error-message" class="error-message font-inter" style="display:none;"></p>
            </form>

            <div style="margin-top: 1.5rem; text-align: center;">
                <p class="font-inter" style="font-size: 0.78rem; color: var(--text-dim);">
                    Don't have an account? Configure one in 
                    <a href="/settings" class="page-link" style="color: var(--accent); text-decoration: none;">Settings</a>
                </p>
            </div>
        </div>
    </div>
    
    <script src="/static/js/login.js"></script>
</body>
</html>

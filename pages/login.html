<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENCOR - Sign In</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@400..700&family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">

    <!-- Transition Overlay -->
    <div id="page-overlay" class="page-overlay"></div>

    <div class="login-bg"></div>
    <div class="login-glow login-glow-1"></div>
    <div class="login-glow login-glow-2"></div>

    <!-- Navigation Bar -->
    <nav id="navbar">
        <a href="/" class="logo font-display">
            <i class="fa-solid fa-mountain-sun text-amber-500"></i>
            ENCOR
        </a>
        
        <!-- Desktop Links -->
        <ul class="nav-links font-body">
            <li><a href="/">Home</a></li>
            <li><a href="/accounts">Accounts</a></li>
            <li><a href="/tasks">Tasks</a></li>
            <li><a href="/engagement">Engagement</a></li>
            <li><a href="/safety">Safety</a></li>
            <li><a href="/settings">Settings</a></li>
            <li><a href="/login" class="active">Sign In</a></li>
        </ul>

        <!-- Burger Menu Icon -->
        <div class="burger-menu" id="burger">
            <div class="burger-line line1"></div>
            <div class="burger-line line2"></div>
            <div class="burger-line line3"></div>
        </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu" id="mobile-menu">
        <ul>
            <li><a href="/" class="mobile-link">Home</a></li>
            <li><a href="/accounts" class="mobile-link">Accounts</a></li>
            <li><a href="/tasks" class="mobile-link">Tasks</a></li>
            <li><a href="/engagement" class="mobile-link">Engagement</a></li>
            <li><a href="/safety" class="mobile-link">Safety</a></li>
            <li><a href="/settings" class="mobile-link">Settings</a></li>
            <li><a href="/login" class="mobile-link active">Sign In</a></li>
        </ul>
    </div>

    <!-- Login Card -->
    <div class="login-card card" id="login-card">
        <h1 class="font-display">ENCOR SIGN IN</h1>
        <p class="login-subtitle font-script">Access Automation Telemetry & Control Panel</p>

        <form id="login-form">
            <div class="input-group">
                <label>Admin Username</label>
                <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary style-full w-full justify-center">Sign In to Dashboard</button>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>
        </form>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encor - Login</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@400..700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GSAP (login-only animations) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">

    <!-- Navigation -->
    <nav id="navbar" class="scrolled">
        <div class="font-display" style="font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-mountain-sun" style="color: var(--accent);"></i>
            ENCOR
        </div>
        
        <ul class="nav-links font-body">
            <li><a href="/">Home</a></li>
        </ul>

        <div class="burger-menu" id="burger">
            <div class="burger-line line1"></div>
            <div class="burger-line line2"></div>
            <div class="burger-line line3"></div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobile-menu">
        <ul>
            <li><a href="/" class="mobile-link">Home</a></li>
        </ul>
    </div>

    <!-- Static Parallax Background for Login (no scroll needed) -->
    <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden;">
        <div class="parallax-layer layer-bg" style="position: absolute; width: 100%; height: 100%;"></div>
        <div class="parallax-layer layer-mountains" style="position: absolute; width: 100%; height: 100%;"></div>
        <div class="parallax-layer layer-foreground" style="position: absolute; width: 100%; height: 100%;"></div>
        <div class="framing-overlay"></div>
    </div>

    <!-- Login UI Container -->
    <div class="login-container">
        <div class="login-card" id="login-card">
            <h2 class="font-display" style="font-size: 2.5rem; letter-spacing: 0.05em; margin-bottom: 0.5rem;">ENCOR</h2>
            <p class="font-script login-subtitle" style="font-size: 1.5rem;">Sign in to begin your journey.</p>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="username" class="font-body">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" class="font-body" required>
                </div>
                <div class="input-group">
                    <label for="password" class="font-body">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" class="font-body" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary font-display" style="width: 100%;">Sign In</button>
                </div>
                <p id="error-message" class="error-message font-body" style="display:none;"></p>
            </form>
        </div>
    </div>
    
    <script src="/static/js/login.js"></script>
</body>
</html>
